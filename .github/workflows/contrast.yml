name: Contrast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    name: Contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voaneves/dtcg-contrast@v1
        with:
          config: .github/contrast/contrast.config.json
          summary: 'true'
          fail-on-error: 'true'
